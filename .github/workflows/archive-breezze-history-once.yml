name: One-time complete original Breezze source archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-breezze-history-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: 5fe8263d7f93db4e8b08ad6b16e675e95afe0e51
      ARCHIVE_TAG: breezze-pre-fork-retirement-20261125
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export every source branch and tag, not only main
        shell: bash
        run: |
          set -euo pipefail
          git remote add old-breezze https://github.com/MetroKim/Breezze.git
          git fetch --no-tags old-breezze '+refs/heads/*:refs/remotes/old-breezze/*'
          git fetch --no-tags old-breezze '+refs/tags/*:refs/tags/breezze-source/*'
          actual="$(git rev-parse refs/remotes/old-breezze/main)"
          test "$actual" = "$SOURCE_SHA" || {
            echo "::error::Source main advanced; review before archive"
            exit 1
          }
          mapfile -t refs < <(git for-each-ref --format='%(refname)' \
            refs/remotes/old-breezze refs/tags/breezze-source)
          echo "Snapshot contains ${#refs[@]} source refs"
          test "${#refs[@]}" -ge 11
          git bundle create "$RUNNER_TEMP/breezze-all-branches-and-tags.bundle" "${refs[@]}"
          git bundle verify "$RUNNER_TEMP/breezze-all-branches-and-tags.bundle"
          git bundle list-heads "$RUNNER_TEMP/breezze-all-branches-and-tags.bundle" \
            | tee "$RUNNER_TEMP/archived-source-ref-list.txt"
      - name: Export pull requests, review notes, and issue discussions
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/breezze-pr-history"
          mkdir -p "$archive/pulls"
          gh api 'repos/MetroKim/Breezze/pulls?state=all&per_page=100' > "$archive/pull-requests.json"
          gh api 'repos/MetroKim/Breezze/issues?state=all&per_page=100' > "$archive/issues.json"
          gh api 'repos/MetroKim/Breezze/branches?per_page=100' > "$archive/branches.json"
          for number in $(seq 1 8); do
            gh api "repos/MetroKim/Breezze/pulls/$number" > "$archive/pulls/$number.json"
            gh api "repos/MetroKim/Breezze/pulls/$number/reviews?per_page=100" > "$archive/pulls/$number-reviews.json"
            gh api "repos/MetroKim/Breezze/pulls/$number/comments?per_page=100" > "$archive/pulls/$number-code-comments.json"
            gh api "repos/MetroKim/Breezze/issues/$number/comments?per_page=100" > "$archive/pulls/$number-discussion.json"
          done
          cp "$RUNNER_TEMP/archived-source-ref-list.txt" "$archive/archived-source-ref-list.txt"
          (cd "$RUNNER_TEMP" && zip -qr breezze-pr-and-branch-metadata.zip breezze-pr-history)
      - name: Upload additional permanent assets to the existing migration release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$ARCHIVE_TAG" >/dev/null
          for item in breezze-all-branches-and-tags.bundle breezze-pr-and-branch-metadata.zip; do
            if gh release view "$ARCHIVE_TAG" --json assets \
              --jq '.assets[].name' | grep -Fxq "$item"; then
              echo "::error::Backup asset already exists; never replace it automatically"
              exit 1
            fi
          done
          gh release upload "$ARCHIVE_TAG" \
            "$RUNNER_TEMP/breezze-all-branches-and-tags.bundle" \
            "$RUNNER_TEMP/breezze-pr-and-branch-metadata.zip"
          gh release view "$ARCHIVE_TAG" --json assets \
            --jq '.assets[] | [.name, .size] | @tsv'
