name: Deploy Breezze API edge

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breezze-api-edge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare API Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Worker dependencies
        working-directory: infra/cloudflare/api-worker
        run: npm install --no-audit --no-fund
      - name: Typecheck Worker
        working-directory: infra/cloudflare/api-worker
        run: npm run check
      - name: Validate deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BREEZZE_API_ORIGIN: ${{ secrets.BREEZZE_API_ORIGIN }}
          EDGE_SHARED_SECRET: ${{ secrets.EDGE_SHARED_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$BREEZZE_API_ORIGIN"
          test "${#EDGE_SHARED_SECRET}" -ge 32
          node -e "const u=new URL(process.env.BREEZZE_API_ORIGIN); if(u.protocol!=='https:' || u.pathname!=='/' || u.search || u.hash || u.username || u.password) process.exit(1)"
      - name: Deploy Worker and inject origin secret
        working-directory: infra/cloudflare/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BREEZZE_API_ORIGIN: ${{ secrets.BREEZZE_API_ORIGIN }}
          EDGE_SHARED_SECRET: ${{ secrets.EDGE_SHARED_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$EDGE_SHARED_SECRET" | npx wrangler secret put EDGE_SHARED_SECRET
          npx wrangler deploy --var "API_ORIGIN:$BREEZZE_API_ORIGIN"
      - name: Verify public API edge
        env:
          BREEZZE_API_PUBLIC_URL: ${{ secrets.BREEZZE_API_PUBLIC_URL }}
        run: |
          set -euo pipefail
          test -n "$BREEZZE_API_PUBLIC_URL"
          response="$(curl --fail --silent --show-error --max-time 20 -D /tmp/breezze-headers "$BREEZZE_API_PUBLIC_URL/health")"
          printf '%s' "$response" | grep -q '"status":"ok"'
          grep -qi '^x-breezze-edge-cache: BYPASS' /tmp/breezze-headers
          echo "Breezze API edge health check passed."
