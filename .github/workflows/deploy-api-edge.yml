name: Deploy Breezze API edge

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: breezze-api-edge-deploy
  cancel-in-progress: false

# Absolute production freeze. Remove this guard only by reviewed change after
# every Breezze acceptance gate and explicit owner release authorization.
jobs:
  deploy:
    if: ${{ false }}
    name: Deploy Cloudflare API Worker (BLOCKED: full-app release freeze)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Worker dependencies
        working-directory: infra/cloudflare/api-worker
        run: npm install --no-audit --no-fund
      - name: Typecheck Worker
        working-directory: infra/cloudflare/api-worker
        run: npm run check
      - name: Validate deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BREEZZE_API_ORIGIN: ${{ secrets.BREEZZE_API_ORIGIN }}
          EDGE_SHARED_SECRET: ${{ secrets.EDGE_SHARED_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$BREEZZE_API_ORIGIN"
          test "${#EDGE_SHARED_SECRET}" -ge 32
          node -e "const u=new URL(process.env.BREEZZE_API_ORIGIN); if(u.protocol!=='https:' || u.pathname!=='/' || u.search || u.hash || u.username || u.password) process.exit(1)"
      - name: Deploy Worker and inject origin secret
        id: deploy
        working-directory: infra/cloudflare/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BREEZZE_API_ORIGIN: ${{ secrets.BREEZZE_API_ORIGIN }}
          EDGE_SHARED_SECRET: ${{ secrets.EDGE_SHARED_SECRET }}
          BREEZZE_API_PUBLIC_URL: ${{ secrets.BREEZZE_API_PUBLIC_URL }}
        run: |
          set -euo pipefail
          printf '%s' "$EDGE_SHARED_SECRET" | npx wrangler secret put EDGE_SHARED_SECRET
          deploy_output="$(npx wrangler deploy --var "API_ORIGIN:$BREEZZE_API_ORIGIN" 2>&1)"
          printf '%s\n' "$deploy_output"
          worker_url="${BREEZZE_API_PUBLIC_URL:-$(printf '%s\n' "$deploy_output" | grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' | tail -n 1 || true)}"
          if [ -z "$worker_url" ]; then
            echo "::error::Could not determine the Worker URL. Set BREEZZE_API_PUBLIC_URL to the deployed Worker URL and rerun."
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
      - name: Publish Worker URL for Flutter release builds
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          gh variable set BREEZZE_API_URL --body "$WORKER_URL"
          echo "Saved BREEZZE_API_URL repository variable: $WORKER_URL"
      - name: Verify public API edge
        env:
          BREEZZE_API_PUBLIC_URL: ${{ secrets.BREEZZE_API_PUBLIC_URL }}
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          public_url="${BREEZZE_API_PUBLIC_URL:-$WORKER_URL}"
          response="$(curl --fail --silent --show-error --max-time 20 -D /tmp/breezze-headers "$public_url/health")"
          printf '%s' "$response" | grep -q '"status":"ok"'
          grep -qi '^x-breezze-edge-cache: BYPASS' /tmp/breezze-headers
          echo "Breezze API edge health check passed."
