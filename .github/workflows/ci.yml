name: CI

on:
  push:
    branches:
      - main
      - develop
      - breezze
  pull_request:
    branches:
      - main
      - breezze
      - feat/youtube-music-primary-provider
  workflow_dispatch:

permissions:
  contents: read

# Preserve the currently executing run's evidence, but keep only the newest
# pending commit for each branch. A source change still needs fresh green CI.
concurrency:
  group: breezze-ci-${{ github.workflow }}-${{ github.ref }}
  # Keep the currently executing verification alive even during rapid commits.
  # GitHub retains only the newest pending run for this concurrency group.
  # A completed run does not certify later commits: the newest SHA still runs.
  cancel-in-progress: false

jobs:
  independent_identity:
    name: Breezze independent identity and playback scaffold guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical Flutter package and reject fake audio scaffold
        run: python3 tools/check_independent_identity.py
      - name: Verify V8 nonproduction media probe safety and range parsing
        run: node --test backend/api/scripts/probe-authorized-full-song.test.mjs

  quality:
    name: Breezze quality gates
    uses: ./.github/workflows/breezze-quality.yml

  youtube_music_catalog:
    name: Private YouTube Music catalog contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated metadata adapter dependencies
        run: python -m pip install -r backend/ytmusicapi/requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile backend/ytmusicapi/main.py
      - name: Run offline metadata and sanitization tests
        env:
          PYTHONPATH: backend/ytmusicapi
        run: python -m unittest discover -s backend/ytmusicapi -p 'test_*.py' -v
