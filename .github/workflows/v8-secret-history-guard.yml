name: Breezze V8 secret history guard

on:
  push:
    branches: [main, develop, breezze]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

# The project must be audited for historical leaks before release. A passing
# current-tree scan does NOT prove previously exposed keys were revoked.
permissions:
  contents: read

concurrency:
  group: breezze-secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  leaked-credentials:
    name: Scan entire Git history (no public findings artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Search committed history for leaked credentials
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
