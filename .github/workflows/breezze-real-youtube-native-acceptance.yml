name: Breezze Real YouTube Native Audio Acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/breezze-real-youtube-native-acceptance.yml
      - apps/mobile/integration_test/real_youtube_native_on_emulator_test.dart
      - apps/mobile/lib/core/audio/device_youtube_audio_resolver.dart
      - apps/mobile/lib/core/audio/youtube_stream_probe.dart
      - apps/mobile/lib/core/audio/just_audio_engine_adapter.dart
      - apps/mobile/lib/features/player/player_controller.dart
      - apps/mobile/pubspec.yaml

permissions:
  contents: read

concurrency:
  group: breezze-real-youtube-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-real-audio:
    name: Android ExoPlayer real YouTube audio (no mocks)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner
        working-directory: apps/mobile
        run: bash tool/generate_platform_targets.sh
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate local Drift code
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-breezze-android-gradle-${{ hashFiles('apps/mobile/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-breezze-android-gradle-
      - name: Warm Android debug build with bounded network retries
        working-directory: apps/mobile
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --debug --dart-define=BREEZZE_API_URL=https://breezze-api-edge.ykw8vmq7ph.workers.dev; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify REAL licensed sample audio on Android native player
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            cd apps/mobile
            flutter test integration_test/real_youtube_native_on_emulator_test.dart -d emulator-5554 --reporter expanded --dart-define=BREEZZE_API_URL=https://breezze-api-edge.ykw8vmq7ph.workers.dev
