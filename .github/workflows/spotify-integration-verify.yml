name: Breezze Spotify Deezer Audio and YouTube Video Isolation

on:
  push:
    branches: [main]
    paths:
      - 'backend/api/src/providers/**'
      - 'apps/mobile/lib/app/bootstrap.dart'
      - 'apps/mobile/lib/core/audio/**'
      - 'apps/mobile/lib/core/api/breezze_api.dart'
      - 'apps/mobile/lib/features/player/unified_media_handoff.dart'
      - 'apps/mobile/lib/features/search/search_screen.dart'
      - 'apps/mobile/lib/features/home/home_screen.dart'
      - 'apps/mobile/lib/features/library/library_screen.dart'
      - 'apps/mobile/lib/features/catalog/catalog_detail_screens.dart'
      - 'apps/mobile/lib/features/player/official_music_playback.dart'
      - 'apps/mobile/lib/features/browse/browse_screen.dart'
      - 'apps/mobile/test/browse_screen_test.dart'
      - 'apps/mobile/test/search_typeahead_test.dart'
      - 'apps/mobile/test/spotify_playback_handoff_test.dart'
      - 'apps/mobile/test/deezer_playback_handoff_test.dart'
      - 'apps/mobile/test/home_screen_test.dart'
      - 'apps/mobile/test/catalog_detail_screens_test.dart'
      - 'apps/mobile/test/deezer_playback_handoff_test.dart'
      - 'apps/mobile/pubspec.yaml'
      - '.github/workflows/spotify-integration-verify.yml'
  pull_request:
    paths:
      - 'backend/api/src/providers/**'
      - 'apps/mobile/lib/app/bootstrap.dart'
      - 'apps/mobile/lib/core/audio/**'
      - 'apps/mobile/lib/core/api/breezze_api.dart'
      - 'apps/mobile/lib/features/player/unified_media_handoff.dart'
      - 'apps/mobile/lib/features/search/search_screen.dart'
      - 'apps/mobile/lib/features/home/home_screen.dart'
      - 'apps/mobile/lib/features/library/library_screen.dart'
      - 'apps/mobile/lib/features/catalog/catalog_detail_screens.dart'
      - 'apps/mobile/lib/features/player/official_music_playback.dart'
      - 'apps/mobile/lib/features/browse/browse_screen.dart'
      - 'apps/mobile/test/browse_screen_test.dart'
      - 'apps/mobile/test/search_typeahead_test.dart'
      - 'apps/mobile/test/spotify_playback_handoff_test.dart'
      - 'apps/mobile/test/deezer_playback_handoff_test.dart'
      - 'apps/mobile/test/home_screen_test.dart'
      - 'apps/mobile/test/catalog_detail_screens_test.dart'
      - 'apps/mobile/pubspec.yaml'
      - '.github/workflows/spotify-integration-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breezze-spotify-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spotify-api:
    name: Spotify and Deezer catalog authorization acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies and Prisma types
        run: npm install --no-audit --no-fund && npx prisma generate
      - name: Verify backend TypeScript
        run: npm run typecheck
      - name: Verify Spotify and Deezer metadata contracts and provider isolation
        run: npx jest --runInBand src/providers/spotify.adapter.spec.ts src/providers/deezer.adapter.spec.ts src/providers/provider-registry.service.spec.ts

  mobile:
    name: Flutter Spotify Deezer handoffs and no-native-YouTube guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Confirm unsupported YouTube audio extraction is absent
        run: |
          set -euo pipefail
          if grep -R -n 'youtube_explode_dart\|DeviceYouTubeAudioResolver\|probeYouTubeAudioStream' lib pubspec.yaml; then
            echo 'Unsupported YouTube native-audio resolution remains in Flutter production source' >&2
            exit 1
          fi
      - name: Validate official Spotify and Deezer routing, previews and playback policy
        run: flutter test --reporter expanded test/spotify_playback_handoff_test.dart test/deezer_playback_handoff_test.dart test/core/audio/playback_source_policy_test.dart test/features/player/unified_media_handoff_test.dart test/browse_screen_test.dart test/search_typeahead_test.dart test/home_screen_test.dart test/catalog_detail_screens_test.dart
