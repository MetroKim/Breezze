name: Breezze Live QA Full-Track Media Delivery (No Production Deployment)

on:
  # Explicit opt-in until the repository has a scoped Cloudflare Actions
  # deployment token; unrelated main pushes must never fail on absent secrets.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breezze-live-media-qa
  cancel-in-progress: false

jobs:
  qa-deploy:
    name: Deploy isolated QA Worker and verify signed AAC streaming
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: infra/cloudflare/media-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated QA deployment access
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare GitHub Actions token/account secrets are not configured. QA has NOT been deployed."
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Worker type safety and private R2 unit tests
        run: npm run check && npm test
      - name: Deploy QA Worker (never breezze-media)
        run: |
          set -euo pipefail
          npx wrangler deploy --env qa
          # This private testing secret is never published, checked in or
          # reused as MEDIA_SIGNING_KEY in the production API/Worker.
          secret="$(openssl rand -hex 48)"
          printf '%s' "$secret" | npx wrangler secret put MEDIA_SIGNING_KEY --env qa
          printf '%s' "$secret" > "$RUNNER_TEMP/breezze-qa-media-secret"
          chmod 600 "$RUNNER_TEMP/breezze-qa-media-secret"
      - name: Generate full-length original test audio and verify R2 range/delivery
        run: |
          set -euo pipefail
          QA_HOST="https://breezze-media-qa.ykw8vmq7ph.workers.dev"
          test "$(curl -fsS --retry 5 --retry-delay 3 --max-time 15 "$QA_HOST/health" | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>process.stdout.write(JSON.parse(s).status))")" = configured
          QA_ID="$(node -e "console.log(require('node:crypto').randomUUID())")"
          QA_OBJECT="audio/$QA_ID/AAC_256"
          cleanup() {
            npx wrangler r2 object delete "breezze-media-qa/$QA_OBJECT" --remote >/dev/null 2>&1 || true
            if [ -n "${QA_VIDEO_OBJECT:-}" ]; then
              npx wrangler r2 object delete "breezze-media-qa/$QA_VIDEO_OBJECT" --remote >/dev/null 2>&1 || true
            fi
            rm -f "$RUNNER_TEMP/breezze-qa-media-secret"
          }
          trap cleanup EXIT
          # Synthetic 125-second recording: no copyrighted artist audio.
          # 5-second previews cannot prove full-length delivery or far seeks.
          ffmpeg -hide_banner -loglevel error -nostdin -f lavfi -i 'sine=frequency=440:sample_rate=16000:duration=125' -c:a aac -b:a 128k -movflags +faststart -y "$RUNNER_TEMP/breezze-qa.m4a"
          QA_DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$RUNNER_TEMP/breezze-qa.m4a")"
          awk -v seconds="$QA_DURATION" 'BEGIN { exit !(seconds >= 124 && seconds <= 127) }'
          QA_BYTES="$(stat -c%s "$RUNNER_TEMP/breezze-qa.m4a")"
          QA_EXPIRES="$(node -e 'process.stdout.write(String(Date.now()+120000))')"
          export QA_ID QA_BYTES QA_EXPIRES
          export QA_SECRET="$(cat "$RUNNER_TEMP/breezze-qa-media-secret")"
          QA_UPLOAD_SIG="$(node -e 'const {createHmac}=require("node:crypto");const p=`ingest:${process.env.QA_ID}:AAC_256:audio/mp4:${process.env.QA_BYTES}:${process.env.QA_EXPIRES}`;process.stdout.write(createHmac("sha256",process.env.QA_SECRET).update(p).digest("base64url"))')"
          QA_PLAY_SIG="$(node -e 'const {createHmac}=require("node:crypto");const p=`${process.env.QA_ID}:AAC_256:${process.env.QA_EXPIRES}`;process.stdout.write(createHmac("sha256",process.env.QA_SECRET).update(p).digest("base64url"))')"
          QA_UPLOAD_URL="$QA_HOST/ingest/audio/$QA_ID/AAC_256?b=$QA_BYTES&m=audio%2Fmp4&e=$QA_EXPIRES&s=$QA_UPLOAD_SIG"
          QA_PLAY_URL="$QA_HOST/audio/$QA_ID/AAC_256?e=$QA_EXPIRES&s=$QA_PLAY_SIG"
          [ "$(curl -sS --retry 3 --max-time 30 -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: audio/mp4' --data-binary "@$RUNNER_TEMP/breezze-qa.m4a" "$QA_UPLOAD_URL")" = 201 ]
          HEADERS="$(curl -fsSI --max-time 20 "$QA_PLAY_URL")"
          printf '%s' "$HEADERS" | grep -qi '^content-type: audio/mp4'
          [ "$(curl -sS --max-time 20 -o "$RUNNER_TEMP/breezze-range.bin" -w '%{http_code}' -H 'Range: bytes=0-1023' "$QA_PLAY_URL")" = 206 ]
          [ "$(wc -c < "$RUNNER_TEMP/breezze-range.bin" | tr -d ' ')" = 1024 ]
          [ "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$QA_HOST/audio/$QA_ID/AAC_256?e=$QA_EXPIRES&s=forged")" = 403 ]
          # Verify the *complete* remote recording can be fetched byte-for-byte.
          [ "$(curl -sS --max-time 40 -o "$RUNNER_TEMP/breezze-qa-remote.m4a" -w '%{http_code}' "$QA_PLAY_URL")" = 200 ]
          cmp "$RUNNER_TEMP/breezze-qa.m4a" "$RUNNER_TEMP/breezze-qa-remote.m4a"
          REMOTE_DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$RUNNER_TEMP/breezze-qa-remote.m4a")"
          awk -v seconds="$REMOTE_DURATION" 'BEGIN { exit !(seconds >= 124 && seconds <= 127) }'
          # Far seek approximates a player asking for bytes near media EOF.
          [ "$(curl -sS --max-time 20 -o "$RUNNER_TEMP/breezze-tail.bin" -w '%{http_code}' -H 'Range: bytes=-1024' "$QA_PLAY_URL")" = 206 ]
          tail -c 1024 "$RUNNER_TEMP/breezze-qa.m4a" > "$RUNNER_TEMP/breezze-tail-expected.bin"
          cmp "$RUNNER_TEMP/breezze-tail-expected.bin" "$RUNNER_TEMP/breezze-tail.bin"
          # QA proves Worker + R2 are capable of licensed full-length delivery.
          # It does NOT prove any artist rights, mobile decoder or offline grant.
          echo 'PASS: synthetic 125s AAC signed full-byte delivery, ffprobe duration, 206 far seek, forged-signature denial'
          # Licensed-video transport QA is isolated from commercial YouTube.
          # Generate our own H.264/AAC clip and exercise the REAL deployed QA
          # Worker and R2 bucket with purpose-bound video HMACs.
          QA_VIDEO_ID="$(node -e "console.log(require('node:crypto').randomUUID())")"
          QA_VIDEO_OBJECT="video/$QA_VIDEO_ID/original.mp4"
          export QA_VIDEO_ID
          ffmpeg -hide_banner -loglevel error -nostdin \
            -f lavfi -i 'testsrc2=size=64x64:rate=8:duration=4' \
            -f lavfi -i 'sine=frequency=440:sample_rate=16000:duration=4' \
            -t 4 -c:v libx264 -pix_fmt yuv420p -profile:v baseline \
            -preset ultrafast -crf 35 -c:a aac -b:a 24k \
            -movflags +faststart -y "$RUNNER_TEMP/breezze-qa-video.mp4"
          QA_VIDEO_BYTES="$(stat -c%s "$RUNNER_TEMP/breezze-qa-video.mp4")"
          test "$QA_VIDEO_BYTES" -gt 2048
          test "$QA_VIDEO_BYTES" -lt 90000
          export QA_VIDEO_BYTES
          QA_VIDEO_EXPIRES="$(node -e 'process.stdout.write(String(Date.now()+120000))')"
          export QA_VIDEO_EXPIRES
          QA_VIDEO_UPLOAD_SIG="$(node -e 'const {createHmac}=require("node:crypto");const p=`ingest:video:${process.env.QA_VIDEO_ID}:video/mp4:${process.env.QA_VIDEO_BYTES}:${process.env.QA_VIDEO_EXPIRES}`;process.stdout.write(createHmac("sha256",process.env.QA_SECRET).update(p).digest("base64url"))')"
          QA_VIDEO_STREAM_SIG="$(node -e 'const {createHmac}=require("node:crypto");const p=`video:${process.env.QA_VIDEO_ID}:stream:${process.env.QA_VIDEO_EXPIRES}`;process.stdout.write(createHmac("sha256",process.env.QA_SECRET).update(p).digest("base64url"))')"
          QA_VIDEO_UPLOAD_URL="$QA_HOST/ingest/video/$QA_VIDEO_ID?b=$QA_VIDEO_BYTES&e=$QA_VIDEO_EXPIRES&s=$QA_VIDEO_UPLOAD_SIG"
          QA_VIDEO_STREAM_URL="$QA_HOST/video/$QA_VIDEO_ID/stream?e=$QA_VIDEO_EXPIRES&s=$QA_VIDEO_STREAM_SIG"
          [ "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: video/mp4' --data-binary "@$RUNNER_TEMP/breezze-qa-video.mp4" "$QA_VIDEO_UPLOAD_URL")" = 201 ]
          VIDEO_HEADERS="$(curl -fsSI --max-time 20 "$QA_VIDEO_STREAM_URL")"
          printf '%s' "$VIDEO_HEADERS" | grep -qi '^content-type: video/mp4'
          printf '%s' "$VIDEO_HEADERS" | grep -qi '^accept-ranges: bytes'
          [ "$(curl -sS --max-time 20 -o "$RUNNER_TEMP/breezze-qa-video-range.bin" -w '%{http_code}' -H 'Range: bytes=128-1023' "$QA_VIDEO_STREAM_URL")" = 206 ]
          head -c 1024 "$RUNNER_TEMP/breezze-qa-video.mp4" | tail -c 896 > "$RUNNER_TEMP/breezze-qa-video-range-expected.bin"
          cmp "$RUNNER_TEMP/breezze-qa-video-range-expected.bin" "$RUNNER_TEMP/breezze-qa-video-range.bin"
          [ "$(curl -sS --max-time 40 -o "$RUNNER_TEMP/breezze-qa-video-full.mp4" -w '%{http_code}' "$QA_VIDEO_STREAM_URL")" = 200 ]
          cmp "$RUNNER_TEMP/breezze-qa-video.mp4" "$RUNNER_TEMP/breezze-qa-video-full.mp4"
          QA_VIDEO_DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$RUNNER_TEMP/breezze-qa-video-full.mp4")"
          awk -v seconds="$QA_VIDEO_DURATION" 'BEGIN { exit !(seconds > 3 && seconds < 5) }'
          [ "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$QA_HOST/video/$QA_VIDEO_ID/download?e=$QA_VIDEO_EXPIRES&s=$QA_VIDEO_STREAM_SIG")" = 403 ]
          [ "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$QA_VIDEO_STREAM_URL" -H 'Range: bytes=999999-')" = 416 ]
          [ "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$QA_VIDEO_STREAM_URL" -H 'Range: bytes=-256')" = 206 ]
          [ "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$QA_HOST/video/$QA_VIDEO_ID/stream?e=$QA_VIDEO_EXPIRES&s=forged")" = 403 ]
          echo 'PASS: QA Worker/R2 signed original MP4 full delivery, 206 video seek, decoder duration, 403 forgery and purpose isolation'

