name: Breezze Video Native iOS Simulator Acceptance

on:
  push:
    branches:
      - fix/video-reliability-security-20261127
    paths:
      - 'apps/mobile/lib/features/video/**'
      - 'apps/mobile/integration_test/video_native_decode_on_ios_simulator_test.dart'
      - '.github/workflows/breezze-video-ios-simulator-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-video-decoder:
    runs-on: macos-15-intel
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 for AVFoundation plugin
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          xcodes=(/Applications/Xcode_26*.app)
          if (( ${#xcodes[@]} == 0 )); then
            echo "Xcode 26 unavailable on this runner" >&2
            exit 1
          fi
          selected=$(printf '%s\n' "${xcodes[@]}" | sort | tail -n 1)
          sudo xcode-select --switch "$selected/Contents/Developer"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply official Flutter simulator log startup fix if needed
        shell: bash
        run: |
          set -euo pipefail
          sdk_file="$FLUTTER_ROOT/packages/flutter_tools/lib/src/ios/simulators.dart"
          if ! grep -Fq "await logReader._ready.future;" "$sdk_file"; then
            curl --fail --location --retry 3 --silent --show-error \
              "https://github.com/flutter/flutter/commit/c3ed85ef987759ee54a6bce275490cde2a238dc1.patch" \
              --output "$RUNNER_TEMP/flutter-ios-log-stream-ready.patch"
            cd "$FLUTTER_ROOT"
            git apply --check --include="packages/flutter_tools/lib/src/ios/simulators.dart" \
              "$RUNNER_TEMP/flutter-ios-log-stream-ready.patch"
            git apply --include="packages/flutter_tools/lib/src/ios/simulators.dart" \
              "$RUNNER_TEMP/flutter-ios-log-stream-ready.patch"
            rm -f bin/cache/flutter_tools.snapshot bin/cache/flutter_tools.stamp
            flutter --version
          fi
      - name: Generate original rights-safe H.264/AAC MP4
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -nostdin \
            -f lavfi -i 'testsrc2=size=64x64:rate=8:duration=4' \
            -f lavfi -i 'sine=frequency=440:sample_rate=16000:duration=4' \
            -t 4 -c:v libx264 -pix_fmt yuv420p -profile:v baseline \
            -level:v 3.0 -preset ultrafast -crf 35 \
            -c:a aac -b:a 24k -movflags +faststart \
            -y "$RUNNER_TEMP/breezze-ios-video-qa.mp4"
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$RUNNER_TEMP/breezze-ios-video-qa.mp4" | awk '{exit !($1 > 3 && $1 < 5)}'
          test "$(stat -f%z "$RUNNER_TEMP/breezze-ios-video-qa.mp4")" -lt 90000
      - name: Generate Flutter iOS app and database
        working-directory: apps/mobile
        run: |
          bash tool/generate_platform_targets.sh
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Boot available iPhone simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          simulator=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data=json.load(sys.stdin)["devices"]
          phones=[d for runtime, ds in data.items()
                  if "iOS" in runtime for d in ds
                  if d.get("isAvailable") and "iPhone" in d.get("name","")]
          if not phones:
              raise SystemExit("No iOS iPhone simulator is available")
          print(phones[0]["udid"])
          ')
          echo "id=$simulator" >> "$GITHUB_OUTPUT"
          SIMULATOR_ID="$simulator" python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          simulator = os.environ["SIMULATOR_ID"]

          def boot():
              state = subprocess.run(
                  ["xcrun", "simctl", "list", "devices", "-j"],
                  check=True, capture_output=True, text=True, timeout=35)
              devices = json.loads(state.stdout)["devices"]
              matches = [d for group in devices.values() for d in group
                         if d["udid"] == simulator]
              if not matches:
                  raise RuntimeError("Simulator became unavailable")
              if matches[0]["state"] != "Booted":
                  subprocess.run(["xcrun", "simctl", "boot", simulator],
                                 check=True, timeout=70)
              subprocess.run(["xcrun", "simctl", "bootstatus", simulator, "-b"],
                             check=True, timeout=200)

          for attempt in (1, 2):
              try:
                  boot()
                  print("iPhone simulator boot completed", flush=True)
                  break
              except (subprocess.SubprocessError, OSError, RuntimeError) as e:
                  print(f"iPhone simulator startup attempt {attempt} failed: {type(e).__name__}",
                        flush=True)
                  subprocess.run(["xcrun", "simctl", "shutdown", simulator],
                                 check=False, timeout=35)
                  if attempt == 2:
                      sys.exit("SIMULATOR_BOOT_UNAVAILABLE")
          PY
      - name: Verify actual AVFoundation MP4 initialization, seek and replay
        timeout-minutes: 30
        working-directory: apps/mobile
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          video_base64="$(base64 -i "$RUNNER_TEMP/breezze-ios-video-qa.mp4" | tr -d '\r\n')"
          flutter test integration_test/video_native_decode_on_ios_simulator_test.dart \
            -d "$SIMULATOR_ID" --reporter expanded --no-pub \
            --dart-define=BREEZZE_VIDEO_QA_BASE64="$video_base64"
