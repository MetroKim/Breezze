name: Breezze Android Playlist Emulator Acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/breezze-android-playlist-acceptance.yml
      - apps/mobile/integration_test/playlist_sync_on_emulator_test.dart
      - apps/mobile/pubspec.yaml

permissions:
  contents: read

concurrency:
  group: breezze-android-playlist-acceptance
  cancel-in-progress: false

jobs:
  emulator-acceptance:
    name: Android device offline and production cloud sync
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native Android runner
        working-directory: apps/mobile
        run: bash tool/generate_platform_targets.sh
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate Drift database code
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Enable KVM acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run real Android filesystem and production API acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            cd apps/mobile
            flutter devices
            flutter test integration_test/playlist_sync_on_emulator_test.dart -d emulator-5554 --reporter expanded --dart-define=BREEZZE_API_URL=https://breezze-api-edge.ykw8vmq7ph.workers.dev
