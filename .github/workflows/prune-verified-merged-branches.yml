# One-time, explicitly allowlisted consolidation of already-merged PR heads.
# Trigger only when this reviewed workflow file changes on main. No broad
# automation that could delete future development branches.
name: Prune verified merged Breezze branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-verified-merged-branches.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove unchanged, verified merged PR branch refs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const expected = {
              "feat/account-preferences-wiring": "867aa7926bb628e080244d4926383a3c37c3a21f",
              "feat/apple-music-parity-navigation-search": "4ab0efb89356fb069dedac6b22651f79a345013a",
              "feat/breezze-audio-engine-foundation": "67ecec6ebd7022249b0e488d8eb95c8a449b9c35",
              "feat/breezze-embedded-official-music-videos": "b61615ec1462d32483a85bab1b7d63358731d130",
              "feat/breezze-end-to-end-listener-wiring": "8c1cc1c47efef06a16b0e904d70b30f3abf5a688",
              "feat/breezze-immersive-lyrics": "97612e4f4865865243e5121d3fd0d8dd8dab68b9",
              "feat/breezze-in-app-completion-contract": "1b59dce98cfd661b406358b8480d9420b278710d",
              "feat/breezze-in-app-support-requests": "7902f9548dbe328b5eea78c210ec6703d4029a81",
              "feat/breezze-personalized-home-feed": "366876a0aaacd9b401d4667d2d44e414e578e099",
              "feat/deezer-soundcloud-catalog": "d8313812cee87a3ffebbd82da82883b9c0ee333b",
              "feat/durable-playback-heartbeats": "41ca653a59c419c6f008cf7f36eb76e34c394f0a",
              "feat/flutter-playback-session-integration": "f32372d2905734f2b120e9ce3d3adb38b6cb11ef",
              "feat/home-feed-rights-safe-recommendations": "b02ca5b770c61053566a460871a2e33abb928005",
              "feat/liquid-glass-design-system": "61996b19c45c1bb6d7e804e2ae103d4def8f6beb",
              "feat/playback-session-pause-resume-contract": "7d18ce77e3d08100b0fdd8fb587863701006daa4",
              "feat/player-sleep-timer": "30e081a06f5492fa4a9378ade2a89f284ccb3f56",
              "feat/recommendations-onboarding-preferences": "b2006cf8369c0a9e01a88a4d1ff0fef0ff58f4a5",
              "feat/server-authorized-playback-sessions": "44991ae1a860b88cb175fe72ac06e16cd8dd0db1",
              "feat/youtube-music-primary-provider": "e5f425fdac2615385dc4e195beb10a27f1a259da",
              "feature/breezze-product-experience": "1c80e62b1bc18926f7129e5884f5776c9e2284b6",
              "fix/backend-atomic-playlist-ordering": "50c5498d36eb5d623d4c5f25a9ec6fc19a0ce756",
              "fix/backend-catalog-foreign-keys": "356aa206a4ed0c44339bd90639cff078ee15b6c3",
              "fix/backend-download-provider-capabilities": "8ec507b6d54aa0802bd2eea5af62f700c8dc7671",
              "fix/backend-listening-history-validation": "f8a80669c22a0c04445a083b17d6bf6a2b877c58",
              "fix/backend-lyrics-translation-rights": "eff14003a1c119fe81d57e534a93c405f1061901",
              "fix/backend-normalize-account-emails": "c82eb16d5d1b840865e83b79deee62bc5490e367",
              "fix/backend-provider-rights-gate": "3d9acba4c61239bc9b5956c08040eb700fa47a96",
              "fix/backend-territory-and-range-audit": "538e86cc7f7a9c3ff8a8aeb8bdb9ef3510ac8914",
              "fix/breezze-local-account-data-isolation": "013e1c318bbb1c08ea04b204e6305e02ca7a453f",
              "fix/breezze-offline-sync-outbox": "3f8084f43ec84beac5c2441c249ab0ce8882d4be",
              "fix/liquid-glass-green": "263ca62df7fa849bbeefa92e116d09072a0c59d7",
              "fix/production-api-connectivity": "66e7f30ff5a24af73c17c5a2973fcc93848a7544",
              "fix/security-global-login-account-throttle-main": "59d973f4ab47d3c232908417a7d308b34116a7b4",
              "fix/settings-feedback-entry": "6d6fb265c832058c321d70939e222525a32e7bbf"
            };
            const keep = new Set(['main', 'breezze', 'chordline']);
            const closed = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'closed', per_page: 100 });
            const opened = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            let deleted = 0;
            let skipped = 0;
            let failed = 0;
            for (const [branch, sha] of Object.entries(expected)) {
              if (keep.has(branch) || branch === context.payload.repository?.default_branch) { skipped++; continue; }
              if (opened.some(p => p.head.ref === branch && p.head.repo?.full_name === owner + '/' + repo)) {
                core.notice('Keep active PR branch ' + branch);
                skipped++;
                continue;
              }
              const accepted = closed.some(p =>
                p.merged_at &&
                p.head.repo?.full_name === owner + '/' + repo &&
                p.head.ref === branch &&
                p.head.sha === sha
              );
              if (!accepted) {
                core.warning('Skip ' + branch + ': no exact merged PR evidence');
                skipped++;
                continue;
              }
              try {
                const current = await github.rest.repos.getBranch({ owner, repo, branch });
                if (current.data.protected || current.data.commit.sha !== sha) {
                  core.warning('Skip changed or protected branch ' + branch);
                  skipped++;
                  continue;
                }
                await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + branch });
                deleted++;
                core.info('Removed merged branch ref: ' + branch);
              } catch (error) {
                if (error.status === 404) {
                  skipped++;
                  continue;
                }
                core.warning('Could not clean ' + branch + ': ' + error.message);
                failed++;
              }
            }
            await core.summary
              .addHeading('Breezze verified branch cleanup')
              .addRaw('Removed ' + deleted + ' previously merged branch references. Skipped ' + skipped + '; failed ' + failed + '. The canonical main branch and unverified work were not modified.')
              .write();
            if (failed > 0) core.setFailed(failed + ' branches could not be cleaned; inspect workflow permissions.');
