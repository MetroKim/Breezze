name: One-time Breezze migration into independent MetroMusic

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-breezze-once.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    name: Preserve source history and stage the independent codebase
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: 5fe8263d7f93db4e8b08ad6b16e675e95afe0e51
      STAGING: migration/breezze-unification-20261125
      ARCHIVE: archive/breezze-fork-main-20261125
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch exact Breezze snapshot and its full history
        shell: bash
        run: |
          set -euo pipefail
          git remote add breezze-source https://github.com/MetroKim/Breezze.git
          git fetch --no-tags breezze-source main
          actual="$(git rev-parse FETCH_HEAD)"
          test "$actual" = "$SOURCE_SHA" || {
            echo "::error::Breezze main advanced; review source before importing: $actual"
            exit 1
          }
          git cat-file -t "$SOURCE_SHA" | grep -qx commit
          echo "Verified source snapshot: $SOURCE_SHA"

      - name: Preserve original fork branch history on independent repository
        shell: bash
        run: |
          set -euo pipefail
          git push origin "$SOURCE_SHA:refs/heads/$ARCHIVE"
          echo "Source history archived at $ARCHIVE"

      - name: Stage Breezze source and remove stale MetroMusic-only scaffold
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "$STAGING"
          git worktree add --detach "$RUNNER_TEMP/breezze-export" "$SOURCE_SHA"
          rsync -a --delete --exclude='/.git' \
            "$RUNNER_TEMP/breezze-export/" "$GITHUB_WORKSPACE/"
          mkdir -p docs/audit
          cat > docs/audit/INDEPENDENT_REPOSITORY_IMPORT.md <<EOF
          # Breezze independent repository source import

          - Destination independent repository: MetroKim/MetroMusic (renamed to MetroKim/Breezze after verification).
          - Imported source snapshot: MetroKim/Breezze at $SOURCE_SHA (prior fork).
          - Source Git history: archive/breezze-fork-main-20261125 in destination.
          - Prior independent main: backup/pre-breezze-import-20261125 in destination.
          - Keep the existing Flutter apps/mobile, NestJS API, Cloudflare Workers and shared packages.
          - Remove old Kotlin/BitChord fork scaffold and unsupported duplicate providers.
          - Use the uploaded ZIP only for visuals, never its fake timer player or mock catalog.
          - Import is not evidence of an Android/iOS/production test pass.
          EOF
          python3 tools/check_independent_identity.py
          test -f apps/mobile/lib/main.dart
          test -f backend/api/prisma/schema.prisma
          test -f docs/design/BREEZZE_UNIFIED_FRONTEND_HANDOFF.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)" || {
            echo "::error::No project files changed in the import"
            exit 1
          }
          git commit -m "chore: unify Breezze Flutter/backend architecture in independent repository"
          git push -u origin "$STAGING"

      - name: Report staged migration
        shell: bash
        run: |
          echo "Migration branch: $STAGING"
          echo "Archive branch: $ARCHIVE"
          echo "Merge to main only after CI verification."
