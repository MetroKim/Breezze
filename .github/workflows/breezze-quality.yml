name: Breezze Quality

on:
  workflow_call:
  push:
    branches:
      - feature/breezze-product-experience
      - breezze
  pull_request:
    branches:
      - breezze
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breezze-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve mobile dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze mobile app
        working-directory: apps/mobile
        run: flutter analyze --fatal-infos

      - name: Test mobile app
        working-directory: apps/mobile
        run: flutter test --reporter expanded

      - name: Resolve audio contracts dependencies
        working-directory: packages/audio_contracts
        run: flutter pub get

      - name: Analyze audio contracts
        working-directory: packages/audio_contracts
        run: flutter analyze --fatal-infos

      - name: Test audio contracts
        working-directory: packages/audio_contracts
        run: flutter test --reporter expanded

  backend:
    name: NestJS and Prisma validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/breezze_ci
        run: npx prisma validate

      - name: Typecheck backend
        run: npm run typecheck

      - name: Test backend
        run: npm test -- --runInBand

      - name: Build backend
        run: npm run build
