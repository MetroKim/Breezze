name: Real public-domain full-song audio acceptance

on:
  push:
    branches:
      - experiment/innertube-stream-probe-20261127
    paths:
      - backend/unofficial-youtube/scripts/probe-public-domain-song.mjs
      - backend/unofficial-youtube/scripts/probe-wikimedia-mp3.mjs
      - .github/workflows/real-open-song-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-artist-track-remote-decode:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audio decoder if not present
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version >/dev/null
      - name: Verify REAL music Ogg bytes and 8 seconds of decoded PCM
        working-directory: backend/unofficial-youtube
        run: node scripts/probe-public-domain-song.mjs

  mp3-transcode-decode:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native decoder if unavailable
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version >/dev/null
      - name: Verify real public-domain MP3 audio and decoder
        working-directory: backend/unofficial-youtube
        run: node scripts/probe-wikimedia-mp3.mjs
