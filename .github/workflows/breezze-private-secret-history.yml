# Security gate: detects secrets in current source AND reachable Git history.
# Breezze source and all reports remain private. Never upload scan artifacts.
name: Breezze private Git history secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breezze-private-secret-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan all reachable private history for credentials
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require private Breezze source
        shell: bash
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          test "$REPO_PRIVATE" = true || {
            echo 'Refusing to process Breezze source if repository is public' >&2
            exit 1
          }
      - name: Checkout full history without persistent credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify full checkout and pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          # Pinned upstream Gitleaks container; no untrusted mutable latest tag.
          docker pull ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      - name: Detect and classify redacted history findings offline
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/breezze-gitleaks-redacted.json"
          scanlog="$RUNNER_TEMP/breezze-gitleaks-run.log"
          trap 'rm -f -- "$report" "$scanlog"' EXIT
          # Scanner network is disconnected; no SARIF or source upload.
          # --exit-code 0 allows safe per-rule counting, then Python fails
          # the gate for ANY findings. Scanner execution errors still fail.
          if ! docker run --rm --network none \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP:/reports" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact=100 --exit-code=0 \
            --report-format=json --report-path=/reports/breezze-gitleaks-redacted.json \
            --log-opts=--all /repo >"$scanlog" 2>&1; then
            echo "::error::Private secret scanner failed to execute; diagnostic details withheld" >&2
            exit 2
          fi
          if [[ ! -s "$report" ]]; then
            echo "::error::Missing Gitleaks report; cannot claim a security pass" >&2
            exit 2
          fi
          python3 - "$report" <<'PY'
          import collections
          import json
          import re
          import sys

          with open(sys.argv[1], encoding='utf-8') as f:
              findings = json.load(f)
          if not isinstance(findings, list):
              raise SystemExit("Invalid secret scan report; cannot pass")
          rules = collections.Counter(
              r.get("RuleID", "unknown") for r in findings if isinstance(r, dict)
          )
          affected = {r.get("File", "") for r in findings if isinstance(r, dict)}
          print(f"Private history scan: {len(findings)} potential matches across {len(affected)} file paths")
          for name, count in sorted(rules.items(), key=lambda v: (-v[1], v[0])):
              rule_id = name if re.fullmatch(r"[a-zA-Z0-9_.-]+", name) else "[redacted-rule]"
              print(f"Rule category: {rule_id} = {count}")
          if findings:
              print("BLOCKED: credentials must be validated and revoked/rotated where real; do not waive this finding count")
              raise SystemExit(1)
          print("PASS: no potential secret disclosures in all reachable Git history")
          PY
