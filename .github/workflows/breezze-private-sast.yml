# Breezze private-source SAST fallback. Does not replace licensed GitHub CodeQL.
# Scans checked-out code locally; do not upload code, SARIF, build bundles or artifacts.
name: Breezze private SAST (Semgrep CE)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breezze-private-sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-community:
    name: Private source static security scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require private Breezze repository
        shell: bash
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPO_PRIVATE" != "true" ]; then
            echo "Refusing to run Breezze private SAST in a public repository" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/breezze-private-sast.yml
      - name: Install pinned Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check "semgrep==1.187.0"
      - name: Scan project source for high-severity security patterns
        shell: bash
        env:
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "false"
          SEMGREP_APP_TOKEN: ""
        run: |
          set -euo pipefail
          # The public rule pack is downloaded; the private source is inspected
          # inside this GitHub runner. No Semgrep Cloud login or source upload.
          # Any high-severity finding, rule error or scanner failure fails CI.
          semgrep scan \
            --config=p/security-audit \
            --metrics=off \
            --strict \
            --error \
            --severity=ERROR \
            --exclude='**/build/**' \
            --exclude='**/.dart_tool/**' \
            --exclude='**/node_modules/**' \
            --exclude='**/generated/**' \
            --exclude='**/*.g.dart' \
            backend apps/mobile/lib packages infra
