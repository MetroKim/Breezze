name: Breezze Video Native Android Emulator Acceptance

on:
  push:
    branches:
      - fix/video-reliability-security-20261127
    paths:
      - 'apps/mobile/lib/features/video/**'
      - 'apps/mobile/integration_test/video_native_decode_on_emulator_test.dart'
      - '.github/workflows/breezze-video-native-emulator-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-video-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate original, rights-safe MP4 fixture for the emulator
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d \
              | xargs -r sudo rm -f || true
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -nostdin \
            -f lavfi -i 'testsrc2=size=64x64:rate=8:duration=4' \
            -f lavfi -i 'sine=frequency=440:sample_rate=16000:duration=4' \
            -t 4 -c:v libx264 -pix_fmt yuv420p -profile:v baseline \
            -level:v 3.0 -preset ultrafast -crf 35 \
            -c:a aac -b:a 24k -movflags +faststart \
            -y "$RUNNER_TEMP/breezze-video-qa.mp4"
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$RUNNER_TEMP/breezze-video-qa.mp4" | awk '{exit !($1 > 3 && $1 < 5)}'
          test "$(stat -c%s "$RUNNER_TEMP/breezze-video-qa.mp4")" -lt 90000
      - name: Generate Flutter Android target
        working-directory: apps/mobile
        run: bash tool/generate_platform_targets.sh
      - name: Fetch Flutter dependencies and generate database
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Allow KVM access
        run: sudo chmod 666 /dev/kvm
      - name: Run actual ExoPlayer video decode on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -e
            VIDEO_QA_BASE64="$(base64 -w 0 "$RUNNER_TEMP/breezze-video-qa.mp4")"
            cd apps/mobile
            flutter test integration_test/video_native_decode_on_emulator_test.dart \
              -d emulator-5554 --reporter expanded \
              --dart-define=BREEZZE_VIDEO_QA_BASE64="$VIDEO_QA_BASE64"
